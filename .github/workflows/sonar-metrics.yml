
name: SonarQube Metrics

on:
  push:
    branches:
      - qa-sonar-metrics
  pull_request:
    branches:
      - qa-sonar-metrics
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-metrics-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_KEY: Plataforma-Reservas-EAV11_plataforma-reservas
  MIN_COVERAGE: 65
  MAX_DEBT_MIN: 960
  MAX_COMPLEXITY: 50

jobs:
  analyze:
    name: Analisis estatico y metricas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Verificar token de SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Falta configurar el secreto SONAR_TOKEN."
            exit 1
          fi

      # Compila el codigo principal sin ejecutar pruebas.
      # No usar verify ni test en este workflow.
      - name: Compilar codigo principal
        run: mvn -B -DskipTests compile
        working-directory: backend

      # Analisis estatico independiente de la ejecucion de tests.
      - name: Analizar con SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=false
        working-directory: backend

      # Esperar el procesamiento del analisis en SonarCloud.
      - name: Esperar procesamiento de SonarCloud
        if: github.event_name == 'push' && github.ref_name == 'qa-sonar-metrics'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          FILE="backend/target/sonar/report-task.txt"

          if [ ! -f "$FILE" ]; then
            echo "::warning::No se encontro report-task.txt."
            exit 0
          fi

          URL=$(grep '^ceTaskUrl=' "$FILE" | cut -d= -f2-)

          if [ -z "$URL" ]; then
            echo "::warning::No se encontro la URL de procesamiento."
            exit 0
          fi

          for i in $(seq 1 30); do
            RESP=$(curl -sS -u "$SONAR_TOKEN:" "$URL")
            STATUS=$(echo "$RESP" | jq -r '.task.status // "UNKNOWN"')

            echo "Estado de SonarCloud: $STATUS"

            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILED|CANCELED)
                echo "::warning::El procesamiento termino con estado $STATUS."
                exit 0
                ;;
            esac

            sleep 5
          done

          echo "::warning::Se agoto el tiempo de espera."
          exit 0

      # Consulta informativa. No ejecuta tests ni bloquea por incumplimientos.
      - name: Consultar criterios de calidad
        if: github.event_name == 'push' && github.ref_name == 'qa-sonar-metrics'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BRANCH: qa-sonar-metrics
        shell: bash
        run: |
          set -u

          API="https://sonarcloud.io/api"

          RESP=$(curl -sS -u "$SONAR_TOKEN:" -G \
            "$API/measures/component" \
            --data-urlencode "component=$PROJECT_KEY" \
            --data-urlencode "branch=$BRANCH" \
            --data-urlencode "metricKeys=coverage,sqale_index,complexity")

          if ! echo "$RESP" | jq -e '.component' >/dev/null 2>&1; then
            echo "::warning::No se pudieron consultar las metricas: $RESP"
            exit 0
          fi

          get_metric() {
            echo "$RESP" | jq -r \
              --arg key "$1" \
              '.component.measures[]? | select(.metric == $key) | .value' \
              | head -n 1
          }

          COV=$(get_metric coverage)
          DEBT=$(get_metric sqale_index)
          CX=$(get_metric complexity)

          # Hallazgos Minor o superior: cuenta issues sin resolver.
          ISSUES_RESP=$(curl -sS -u "$SONAR_TOKEN:" -G \
            "$API/issues/search" \
            --data-urlencode "componentKeys=$PROJECT_KEY" \
            --data-urlencode "branch=$BRANCH" \
            --data-urlencode "severities=MINOR,MAJOR,CRITICAL,BLOCKER" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=1")

          ISSUES=$(echo "$ISSUES_RESP" | jq -r '.total // "N/A"')

          # Vulnerabilidades criticas o bloqueantes sin resolver.
          VULN_RESP=$(curl -sS -u "$SONAR_TOKEN:" -G \
            "$API/issues/search" \
            --data-urlencode "componentKeys=$PROJECT_KEY" \
            --data-urlencode "branch=$BRANCH" \
            --data-urlencode "types=VULNERABILITY" \
            --data-urlencode "severities=CRITICAL,BLOCKER" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=1")

          VULN=$(echo "$VULN_RESP" | jq -r '.total // "N/A"')

          status() {
            if [ "$1" = "true" ]; then
              echo "Cumple"
            else
              echo "No cumple / sin datos"
            fi
          }

          COV_OK=$(awk -v n="${COV:-0}" \
            'BEGIN { exit !(n >= 65) }' && echo true || echo false)

          DEBT_OK=$(awk -v n="${DEBT:--1}" \
            'BEGIN { exit !(n >= 0 && n <= 960) }' && echo true || echo false)

          CX_OK=$(awk -v n="${CX:--1}" \
            'BEGIN { exit !(n >= 0 && n < 50) }' && echo true || echo false)

          VULN_OK=false
          [ "$VULN" = "0" ] && VULN_OK=true

          {
            echo "## Metricas de calidad - SonarCloud"
            echo ""
            echo "| Criterio | Valor | Objetivo | Estado |"
            echo "|---|---:|---|---|"
            echo "| Cobertura | ${COV:-N/A}% | >= 65% | $(status "$COV_OK") |"
            echo "| Deuda tecnica | ${DEBT:-N/A} min | <= 960 min | $(status "$DEBT_OK") |"
            echo "| Complejidad ciclomática | ${CX:-N/A} | < 50 | $(status "$CX_OK") |"
            echo "| Hallazgos Minor o superior | $ISSUES | Informativo | Consultar detalle |"
            echo "| Vulnerabilidades criticas/bloqueantes | $VULN | 0 | $(status "$VULN_OK") |"
            echo ""
            echo "> La consulta es informativa y no bloquea el workflow por incumplir los criterios."
            echo "> La cobertura solo es valida si SonarCloud dispone de un reporte actualizado."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Consulta de metricas finalizada."
          exit 0
