name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Análisis de código
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 25
        uses: actions/setup-java@v5

        with:
          java-version: 25
          distribution: temurin # Alternative distribution options are available.
      - name: Cache SonarQube packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.sonar/cache
          key: ${{ runner.os }}-m2-sonar-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-sonar-
      # mvn verify ejecuta las pruebas unitarias, las de aceptación (Cucumber con
      # PostgreSQL en Testcontainers) y la regla de cobertura de JaCoCo.
      - name: Build and test
        run: mvn -B verify
        working-directory: backend
      # SONAR_TOKEN es un secret de Actions y GitHub no lo entrega a los workflows
      # que dispara Dependabot. Sin token se omite el análisis en lugar de fallar;
      # con token se espera el Quality Gate y el job falla si no se aprueba.
      - name: Analyze with SonarCloud
        if: env.SONAR_TOKEN != ''
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true
        working-directory: backend
      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-pruebas
          path: |
            backend/target/cucumber-reports/
            backend/target/site/jacoco/
            backend/target/site/jacoco-it/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
