spring.application.name=plataforma-reservas

# Las credenciales se leen de variables de entorno; nunca se escriben en este archivo.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:postgres.plukddnkduidpgjlqjym}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Cookie de sesión: HttpOnly y SameSite siempre; Secure desactivable solo para pruebas locales sobre HTTP.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Zona horaria del negocio para validar fechas y horas de las reservas.
app.zona-horaria=${APP_TIME_ZONE:America/Bogota}
